{% extends "base.html" %}

{% block title %}Your Vault - Password Vault{% endblock %}

{% block content %}
<section class="vault-header card">
    <div>
        <p class="muted">Signed in as {{ current_user.username }}</p>
        <h1>Your encrypted vault</h1>
    </div>

    <button type="button">Add credential</button>
</section>

<section class="empty-state card">
    <h2>No saved credentials</h2>
    <p class="muted">
        Your encrypted credentials will appear here after the storage
        functionality is added.
    </p>
</section>
{% endblock %}
